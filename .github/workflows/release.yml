name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release-tag: ${{ github.ref_name }}
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      release-tag: ${{ github.ref_name }}
  release:
    needs: [verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tabkeeper-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tabkeeper-firefox-package
          path: dist
      - name: Publish the tested ZIP as a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/tabkeeper-*.zip \
            --verify-tag --generate-notes --title "Tabkeeper $RELEASE_TAG"
