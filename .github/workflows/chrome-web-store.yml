name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v1.1.0)'
        required: true
        type: string
      submit:
        description: 'Submit for review and publish automatically after approval (otherwise upload draft only)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      release-tag: ${{ inputs.tag }}
      target: chrome
  security:
    needs: validate
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      release-tag: ${{ inputs.tag }}
  publish:
    needs: [verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tabkeeper-package
          path: dist
      - name: Upload tested package and optionally submit for review
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          CWS_SUBMIT: ${{ inputs.submit }}
        run: node scripts/publish-web-store.mjs
